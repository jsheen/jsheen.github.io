<div class="about">
  <img class="avatar" src="https://github.com/{{ site.github_username }}.png" alt="Photo of {{ site.author }}">
  <div class="about-body">
    <h1>{{ site.author }}, PhD</h1>
    <p class="interests">Machine learning, causal inference, <span class="nowrap">public-health</span>, <span class="nowrap">single-panel</span> cartoons, running, biking, skiing, open water, nature, photography @Harvard</p>
    <ul class="contact">
      <li><a href="mailto:{{ site.email }}">{{ site.email }}</a></li>
      <li><a href="https://github.com/{{ site.github_username }}">GitHub</a></li>
      <li><a href="{{ site.scholar_url }}">Google Scholar</a></li>
      <li><a href="{{ site.linkedin_url }}">LinkedIn</a></li>
    </ul>
  </div>
</div>
