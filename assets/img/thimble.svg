<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="ThimbleTheater thimble">
  <rect width="600" height="600" fill="#f6eef0"/>
  <g transform="translate(127.2 119.1) scale(5.4)">
  
  <!-- body: flat top, gently tapered sides -->
  <path d="M17 49 L20 17 Q20.5 12 25 12 L39 12 Q43.5 12 44 17 L47 49 Z" fill="#DCE0E6" stroke="#3B2A35" stroke-width="3" stroke-linejoin="round"/>
  <!-- dimples, in staggered rows down the whole body -->
  <g fill="#3B2A35" opacity=".3">
    <circle cx="28" cy="17.5" r="1.4"/><circle cx="32" cy="16.5" r="1.4"/><circle cx="36" cy="17.5" r="1.4"/>
    <circle cx="25.5" cy="22.5" r="1.4"/><circle cx="30" cy="22" r="1.4"/><circle cx="34.5" cy="22" r="1.4"/><circle cx="39" cy="22.5" r="1.4"/>
    <circle cx="23.5" cy="28" r="1.4"/><circle cx="28" cy="27.5" r="1.4"/><circle cx="32.5" cy="27.5" r="1.4"/><circle cx="37" cy="27.5" r="1.4"/><circle cx="41" cy="28" r="1.4"/>
    <circle cx="25.5" cy="33.5" r="1.4"/><circle cx="30" cy="33" r="1.4"/><circle cx="34.5" cy="33" r="1.4"/><circle cx="39" cy="33.5" r="1.4"/>
    <circle cx="23" cy="39" r="1.4"/><circle cx="27.5" cy="38.5" r="1.4"/><circle cx="32" cy="38.5" r="1.4"/><circle cx="36.5" cy="38.5" r="1.4"/><circle cx="41.5" cy="39" r="1.4"/>
    <circle cx="25" cy="44" r="1.4"/><circle cx="29.5" cy="43.5" r="1.4"/><circle cx="34.5" cy="43.5" r="1.4"/><circle cx="39.5" cy="44" r="1.4"/>
  </g>
  <!-- metal sheen -->
  <path d="M23 18 L21 43" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>
  <!-- rim -->
  <rect x="13" y="47" width="38" height="8" rx="4" fill="#AEB5BF" stroke="#3B2A35" stroke-width="3"/>
</g>
</svg>
