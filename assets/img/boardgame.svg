<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#f4ede2"/>
  <!-- board -->
  <rect x="100" y="100" width="400" height="400" rx="28" fill="#fffdf8" stroke="#2f2f2f" stroke-width="5"/>

  <!-- path: a simple loop of squares around the board -->
  <g stroke="#2f2f2f" stroke-width="4">
    <rect x="136" y="136" width="56" height="56" rx="10" fill="#8fd1a8"/>
    <rect x="204" y="136" width="56" height="56" rx="10" fill="#fffdf8"/>
    <rect x="272" y="136" width="56" height="56" rx="10" fill="#ffd166"/>
    <rect x="340" y="136" width="56" height="56" rx="10" fill="#fffdf8"/>
    <rect x="408" y="136" width="56" height="56" rx="10" fill="#f28b82"/>
    <rect x="408" y="204" width="56" height="56" rx="10" fill="#fffdf8"/>
    <rect x="408" y="272" width="56" height="56" rx="10" fill="#8ab4f8"/>
    <rect x="408" y="340" width="56" height="56" rx="10" fill="#fffdf8"/>
    <rect x="408" y="408" width="56" height="56" rx="10" fill="#8fd1a8"/>
    <rect x="340" y="408" width="56" height="56" rx="10" fill="#fffdf8"/>
    <rect x="272" y="408" width="56" height="56" rx="10" fill="#ffd166"/>
    <rect x="204" y="408" width="56" height="56" rx="10" fill="#fffdf8"/>
    <rect x="136" y="408" width="56" height="56" rx="10" fill="#f28b82"/>
    <rect x="136" y="340" width="56" height="56" rx="10" fill="#fffdf8"/>
    <rect x="136" y="272" width="56" height="56" rx="10" fill="#8ab4f8"/>
    <rect x="136" y="204" width="56" height="56" rx="10" fill="#fffdf8"/>
  </g>

  <!-- two plain pawns -->
  <g stroke="#2f2f2f" stroke-width="4" stroke-linejoin="round">
    <g transform="translate(300 168)">
      <path d="M-16 22 Q-11 2 -7 -2 L7 -2 Q11 2 16 22 Z" fill="#2f2f2f"/>
      <circle cx="0" cy="-12" r="11" fill="#2f2f2f"/>
    </g>
    <g transform="translate(436 304)">
      <path d="M-16 22 Q-11 2 -7 -2 L7 -2 Q11 2 16 22 Z" fill="#fffdf8"/>
      <circle cx="0" cy="-12" r="11" fill="#fffdf8"/>
    </g>
  </g>

  <!-- one die in the middle -->
  <g transform="translate(300 300) rotate(-10)" stroke="#2f2f2f" stroke-width="4">
    <rect x="-38" y="-38" width="76" height="76" rx="16" fill="#fffdf8"/>
    <g fill="#2f2f2f" stroke="none">
      <circle cx="-16" cy="-16" r="6.5"/><circle cx="0" cy="0" r="6.5"/><circle cx="16" cy="16" r="6.5"/>
    </g>
  </g>
</svg>
