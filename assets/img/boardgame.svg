<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- table -->
  <rect width="600" height="600" fill="#f3e6d3"/>
  <!-- board shadow + board -->
  <rect x="78" y="92" width="444" height="444" rx="26" fill="#d9c3a3"/>
  <rect x="70" y="80" width="444" height="444" rx="26" fill="#fffaf0" stroke="#3b3a36" stroke-width="5"/>

  <!-- winding path of squares -->
  <g stroke="#3b3a36" stroke-width="4" stroke-linejoin="round">
    <!-- row 1 (left to right) -->
    <rect x="110" y="120" width="56" height="56" rx="10" fill="#9ed8b4"/>
    <rect x="174" y="120" width="56" height="56" rx="10" fill="#ffd36e"/>
    <rect x="238" y="120" width="56" height="56" rx="10" fill="#ff9e9e"/>
    <rect x="302" y="120" width="56" height="56" rx="10" fill="#a9c8ff"/>
    <rect x="366" y="120" width="56" height="56" rx="10" fill="#9ed8b4"/>
    <!-- down -->
    <rect x="366" y="184" width="56" height="56" rx="10" fill="#ffd36e"/>
    <!-- row 2 (right to left) -->
    <rect x="366" y="248" width="56" height="56" rx="10" fill="#ff9e9e"/>
    <rect x="302" y="248" width="56" height="56" rx="10" fill="#a9c8ff"/>
    <rect x="238" y="248" width="56" height="56" rx="10" fill="#9ed8b4"/>
    <rect x="174" y="248" width="56" height="56" rx="10" fill="#ffd36e"/>
    <rect x="110" y="248" width="56" height="56" rx="10" fill="#ff9e9e"/>
    <!-- down -->
    <rect x="110" y="312" width="56" height="56" rx="10" fill="#a9c8ff"/>
    <!-- row 3 (left to right) -->
    <rect x="110" y="376" width="56" height="56" rx="10" fill="#9ed8b4"/>
    <rect x="174" y="376" width="56" height="56" rx="10" fill="#ffd36e"/>
    <rect x="238" y="376" width="56" height="56" rx="10" fill="#ff9e9e"/>
    <rect x="302" y="376" width="56" height="56" rx="10" fill="#a9c8ff"/>
  </g>

  <!-- finish star -->
  <g transform="translate(410 405)">
    <circle r="40" fill="#ffd36e" stroke="#3b3a36" stroke-width="4"/>
    <path d="M0,-24 L7,-8 L24,-7 L11,4 L15,21 L0,12 L-15,21 L-11,4 L-24,-7 L-7,-8 Z" fill="#fffaf0" stroke="#3b3a36" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- little hearts on a couple of squares -->
  <g fill="#3b3a36">
    <path d="M266 155 c-6 -6 -14 -2 -14 4 c0 6 14 12 14 12 s14 -6 14 -12 c0 -6 -8 -10 -14 -4z"/>
    <path d="M202 412 c-6 -6 -14 -2 -14 4 c0 6 14 12 14 12 s14 -6 14 -12 c0 -6 -8 -10 -14 -4z"/>
  </g>
  <text x="138" y="158" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#3b3a36">GO</text>

  <!-- pawn 1 (green) with a face -->
  <g transform="translate(330 252)" stroke="#3b3a36" stroke-width="4" stroke-linejoin="round">
    <ellipse cx="0" cy="40" rx="26" ry="9" fill="#3fae6d"/>
    <path d="M-20 38 Q-14 6 -9 0 L9 0 Q14 6 20 38 Z" fill="#3fae6d"/>
    <circle cx="0" cy="-12" r="18" fill="#3fae6d"/>
    <g stroke="none" fill="#3b3a36">
      <circle cx="-6" cy="-13" r="2.6"/><circle cx="6" cy="-13" r="2.6"/>
    </g>
    <path d="M-5 -5 Q0 0 5 -5" fill="none" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-11" cy="-7" r="3" fill="#ff9e9e" stroke="none" opacity=".8"/>
    <circle cx="11" cy="-7" r="3" fill="#ff9e9e" stroke="none" opacity=".8"/>
  </g>

  <!-- pawn 2 (coral) with a face -->
  <g transform="translate(202 124)" stroke="#3b3a36" stroke-width="4" stroke-linejoin="round">
    <ellipse cx="0" cy="40" rx="26" ry="9" fill="#ff7a6b"/>
    <path d="M-20 38 Q-14 6 -9 0 L9 0 Q14 6 20 38 Z" fill="#ff7a6b"/>
    <circle cx="0" cy="-12" r="18" fill="#ff7a6b"/>
    <g stroke="none" fill="#3b3a36">
      <circle cx="-6" cy="-13" r="2.6"/><circle cx="6" cy="-13" r="2.6"/>
    </g>
    <path d="M-5 -5 Q0 0 5 -5" fill="none" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-11" cy="-7" r="3" fill="#ffd0c9" stroke="none" opacity=".9"/>
    <circle cx="11" cy="-7" r="3" fill="#ffd0c9" stroke="none" opacity=".9"/>
  </g>

  <!-- dice on the table -->
  <g transform="translate(470 520) rotate(-14)" stroke="#3b3a36" stroke-width="4">
    <rect x="-34" y="-34" width="68" height="68" rx="14" fill="#ffffff"/>
    <g fill="#3b3a36" stroke="none">
      <circle cx="-15" cy="-15" r="6"/><circle cx="15" cy="15" r="6"/><circle cx="0" cy="0" r="6"/>
    </g>
  </g>
  <g transform="translate(398 548) rotate(10)" stroke="#3b3a36" stroke-width="4">
    <rect x="-26" y="-26" width="52" height="52" rx="11" fill="#ffffff"/>
    <g fill="#3b3a36" stroke="none">
      <circle cx="-10" cy="-10" r="5"/><circle cx="10" cy="10" r="5"/><circle cx="10" cy="-10" r="5"/><circle cx="-10" cy="10" r="5"/>
    </g>
  </g>
</svg>
