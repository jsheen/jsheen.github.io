---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}</p>
  {{ content }}
</article>
<p class="back"><a href="{{ '/#blog' | relative_url }}">&larr; All posts</a></p>
